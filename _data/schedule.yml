  - date: "Fri, August 14"
    announcements: "Breakout rooms (group)"
    mentor_time: "Breakout rooms (3 groups)"
    training: "Draft Poster Presentation and Closing"
    recap:
      title: "Session 6 Recap: Poster Presentations, AI Pedagogy Debate, and D.C. Send-Off (August 14, 2026)"
      intro: "The final virtual session of FacultyHack@Gateways 2026 brought Week 2 to a highly collaborative close. Organized as a dynamic presentation sprint and roundtable, the session served as the program's virtual graduation, where participants presented their revised course materials, demonstrated their public GitHub repositories, and reviewed travel logistics for the upcoming in-person conference in Washington, D.C."
      highlights:
        - label: "Disciplinary Presentations & Course Redesigns"
          text: "Each participant presented a draft of their conference poster, outlining how they've re-envisioned their course syllabi to integrate advanced cyberinfrastructure and cloud-based science gateways. Agbeli Ameko (Howard University) presented his upcoming course, Introduction to an Open Source Future, centering on open-source tools, automation, and environmental justice, leveraging Jetstream2 and JupyterHub to let students analyze local datasets through Python and Metabase. Dr. Joshua Gbadebo (Voorhees University) outlined his redesigned Computer Architecture syllabus, integrating Jetstream2 as a cloud platform to teach modern cloud architecture side-by-side with traditional computer architecture, giving students hands-on experience measuring real CPU, memory, and networking allocations. Dr. Tanganika Johnson (Southern University) presented her Environmental Science course, which introduces a course-based undergraduate research experience (CURE) activity centered on urban heat and environmental resilience in South Louisiana, using CloudBank and Jupyter Notebooks to explore, visualize, and analyze local Louisiana climate data. Dr. Cheryl Swanier (Voorhees University) showcased her Introduction to AI course, whose redesigned curriculum integrates Jetstream2 cloud computing infrastructure to let students program, debug, and solve real-world problems with generative AI. Antigone Francis-Anthony (Southern University A&M College) shared updates to her Human Anatomy & Physiology Lab, which serves a large cohort of nursing majors — to support visual learners, she's incorporating science gateway computational tools like BioDigitalHuman and interactive Jupyter notebooks. Dr. Joseph Aneke (Hampton University) walked through his updated Python Programming course, with a highly praised visual \"Course Redesign Workflow\" that clearly contrasted the traditional course structure with his new, gateway-integrated, project-based model. Yohn Parra Bautista (Florida A&M University) presented his redesigned Artificial Intelligence syllabus, utilizing the National Research Platform (NRP) as a low-barrier cyberinfrastructure tool to teach unsupervised machine learning models, letting students deploy and benchmark LLMs across CPU and GPU hardware."
        - label: "The Great AI Pedagogy Debate"
          text: "A central highlight of the session was an energetic roundtable on the ethics, logistics, and realities of integrating artificial intelligence into collegiate classrooms. Dr. Joseph Aneke introduced an innovative grading framework where a major percentage of project grades is allotted to the quality of the prompts students submit, rather than just the final code output, ensuring students are actively learning to code and debug collaboratively with AI rather than simply copy-pasting answers. Dr. Mary Beals shared that she openly embraces AI in her classes with explicit \"guardrails\" — citing her professional development presentation \"Prompt Play Slay,\" she teaches students that knowing how to craft precise prompt constraints is what makes AI an effective academic partner. Sajida Faiyaz noted that because AI cannot be trusted 100% of the time, instructors must shift their focus toward teaching systems analysis, logical architecture design (such as ERD diagramming sprints), and rigorous application security/testing. Organizer Je'aime Powell cautioned the cohort against the common student pitfall of using single prompts for complex tasks, such as generating an entire poster at once, and demonstrated how breaking down a project section-by-section and feeding localized context (e.g., matching a syllabus to a poster template) dramatically improves AI output quality."
        - label: "Technical Pro-Tips & Advanced Tools"
          text: "To help faculty finalize their deliverables, organizers demonstrated several high-efficiency development tools. Je'aime showcased how changing .com to .dev in any active GitHub repository URL instantly opens a browser-based VS Code editing environment, making repository updates seamless. Mermaid.js was highly recommended for creating dynamic, editable flowcharts and system diagrams in GitHub README files using simple markdown text, and Napkin.ai was highlighted as an excellent text-to-visual storytelling tool that converts written text blocks into clean, customizable graphics for posters and slide decks. The group also recommended Perplexity.ai (which validates chat responses with direct source citations) and AnswerThis.io (focused on mapping scholarly literature) for academic writing and curriculum planning."
        - label: "Next Steps: Gateways 2026 in Washington, D.C."
          text: "Dr. Linda Hayden and Je'aime Powell concluded the program by laying out the final steps before the cohort meets in person on September 23–25, 2026. Dr. Hayden requested that all final, official poster titles be submitted immediately so she can compile and submit them to the conference organizers as a group. Faculty are reminded that they are personally responsible for printing and bringing their physical posters to the conference — the maximum poster size is 30\" wide × 45\" high. All final, updated materials, including the original syllabus, the revised syllabus, the poster PDF, and the draft blog post, must be committed to participants' public GitHub repositories. Acceptances and travel instructions will be sent out early next week; San Diego Supercomputer Center agents will coordinate lodging and billing, but participants must book their own flights."
