  - date: "Wed, August 5"
    announcements: "NAIRR — Dr. Oyebade Oyerinde"
    mentor_time: "Breakout rooms (1-on-1)"
    training: "Course Goals (1-slide, 2-minute pitch) and AI Deconstruction Deep Dive — Charlie Dey"
    recap:
      title: "Session 2 Recap: NAIRR Allocations, Cloud Resources, and Google Notebook (August 5, 2026)"
      intro: "The second virtual session of FacultyHack@Gateways 2026 provided participants with critical pathways to acquire high-performance computing (HPC) and artificial intelligence (AI) allocations for their classrooms."
      highlights:
        - label: "The Google Notebook Showcase"
          text: "Organizer Je'aime Powell kicked off the session by demonstrating a powerful workflow utilizing Google's newly updated notebook tool (formerly known as NotebookLM). He showed how dropping session transcripts, meeting chats, and program slides into a dedicated notebook builds a highly targeted, scoped Retrieval-Augmented Generation (RAG) assistant. This allows participants to instantly query program details, deliverables, and lecture materials."
        - label: "NAIRR Pilot Portal & Classroom Allocations"
          text: "Dr. Oyebade Oyerinde (Clark Atlanta University, 2026 NSF NAIRR AI Education Fellow) led an in-depth training on the National Artificial Intelligence Research Resource (NAIRR) Pilot. He highlighted key educational resource providers including Jetstream2 (which offers JupyterHub interfaces and virtual GPU instances like NVIDIA A100s) and CloudBank (offering customized, lightweight JupyterHub environments featuring Python, R, and C++). Dr. Oyerinde shared his personal success deploying a customized CloudBank hub for CAU undergraduate students over the summer."
        - label: "The ACCESS and NAIRR Connection"
          text: "Guest expert Agbeli Ameko provided an essential structural overview. He explained that ACCESS-CI is a national consortium of supercomputing centers pooling hardware resources, while NAIRR is a specialized, NSF-supported subset explicitly dedicated to democratizing national AI training, tools, and research."
        - label: "Proposal Requirements & Scoping"
          text: "Instructors learned how to write a successful NAIRR Classroom Allocation proposal. Requirements include a registered ACCESS ID, an NSF-style CV, and a 3-page Main Document detailing course logistics, per-student GPU/CPU compute estimates, storage requests, and team preparedness. Dr. Oyerinde noted that failing to properly scope per-student resources is the most common stumbling block during the 1-month review process."
        - label: "ACCESS Account Troubleshooting"
          text: "Some participants, such as Kristine Christensen, ran into registration hurdles due to unrecognized institutional domains when creating ACCESS accounts. To resolve these roadblocks, Dr. Linda Hayden scheduled a dedicated ACCESS and NAIRR troubleshooting work session on Friday, August 7 at 5:00 PM Eastern."
        - label: "Mentor Collaboration & Course Goals"
          text: "The session concluded with participants transitioning into virtual breakout rooms with their technical mentors. Teams spent the final block refining their Course Goals slides and preparing for active curriculum adaptation."
