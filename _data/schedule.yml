# FacultyHack@Gateways 2026 program schedule, shown on schedule.html.
# Three parts: the virtual training sessions (Aug 3-14), the in-person
# Gateways 2026 conference in D.C. (Sept 23-25), and a reusable
# breakdown of how each virtual session's 6-8 PM ET block is structured.
#
# Each virtual_sessions entry has three required core fields, one per
# 30/30/60-minute segment of the standard 6-8 PM ET block (matching the
# `daily_flow` breakdown below): `announcements` (6:00-6:30 PM),
# `mentor_time` (6:30-7:00 PM), and `training` (7:00-8:00 PM).
#
# Each entry under virtual_sessions may optionally add a `resources:`
# list once materials exist for that session (slides, a recording, a
# PDF handout, a linked article, etc.) — omit the key entirely for
# sessions with nothing yet, don't add an empty list. Only sessions that
# actually have resources render a "Resources" block on their card, and
# only then do they appear in the "Session Materials" section at the top
# of the Resources page. Each resource:
#   - name (required): link/file text.
#   - url (required): external link, or a path under assets/ for an
#     uploaded PDF.
#   - icon (optional, defaults to "solid:link"): same "style:name" schema
#     as _data/resources.yml — "custom:favicons/<domain-slug>" for a
#     fetched favicon (see "Icon system" in PICKUP_AND_GO.md for how to
#     add one), "solid:file-pdf" for an uploaded PDF, or any Font Awesome
#     "brands:<name>" / "solid:<name>" icon.
#   - description (optional): shown under the link if present.
#
# Each entry may also optionally add a `recap:` block once the session
# has actually happened — a write-up of what was covered, shown as a
# "Session Recap" block on the card. Omit entirely for sessions that
# haven't happened yet, same "don't add an empty one" rule as
# `resources:`. Fields: `title` (required), `intro` (optional lead
# paragraph), `highlights` (optional list of `label`/`text` pairs,
# rendered as a bolded-label list under a "Session Highlights"
# sub-heading).
#
# Each entry may also optionally add a `pre_session:` block for an extra
# block of time before the standard 6:00 PM ET start — used for optional
# drop-in support/office-hours sessions, not part of the standard
# Announcements/Training flow. Fields: `time` (required, a display
# string, e.g. "5:00–6:00 PM ET") and `focus` (required, one line on
# what it covers). When present, the card's header time range also
# switches from the default "6:00–8:00 PM ET" to start at the
# pre-session's start time instead.

virtual_sessions:
  - date: "Mon, August 3"
    announcements: "Welcome & Introductions"
    mentor_time: "Logistics"
    training: "Mentoring Tips & Next Steps — Je'aime Powell and Linda Hayden"
    recap:
      title: "Session 1 Recap: Kickoff, Program Expectations, and SGX3 Overview (August 3, 2026)"
      intro: "The 5th Annual FacultyHack@Gateways 2026 officially launched with a virtual kickoff session that brought together organizers, technical mentors, and faculty participants from across the country."
      highlights:
        - label: "Welcome & Introductions"
          text: "Organizers Je'aime Powell, Dr. Linda Hayden, and Charlie Dey welcomed the cohort. Participants and mentors introduced themselves, sharing their diverse academic backgrounds, research interests, and preliminary plans for course modifications."
        - label: "SGX3 Center of Excellence Overview"
          text: "Dr. Hayden presented on the mission of SGX3, detailing how science gateways serve as vital full-stack bridges connecting researchers, educators, and students with advanced cyberinfrastructure and high-performance computing (HPC) resources."
        - label: "Deliverables & Honorarium Guidelines"
          text: "Je'aime Powell outlined the seven key deliverables required for participants to earn their $500 honorarium. These include Gateways 2026 conference registration, a travel support application, a bio/headshot, a Gateways poster, a GitHub project repository, a short blog post, and a NAIRR education account."
        - label: "Mentor-Mentee Pairings & Breakouts"
          text: "After reviewing expectations, participants broke out into dedicated virtual rooms with their assigned technical mentors. Teams established their preferred communication channels and began collaborating on their Course Goals slides ahead of Wednesday's training."
