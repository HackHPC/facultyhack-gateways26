  - date: "Wed, August 12"
    announcements: "Quantium — Kristine Christensen"
    mentor_time: "Breakout rooms (1-on-1)"
    training: "AI Deconstruction Deep Dive — Charlie Dey"
    recap:
      title: "Session 5 Recap: GitHub Mechanics, Quantum Resources, and LLM Semantics (August 12, 2026)"
      intro: "The fifth session of FacultyHack@Gateways 2026 combined logistics reminders with a hands-on GitHub tutorial, a deep dive into classroom-ready quantum computing resources, and a continuation of the AI deconstruction lecture series into how LLMs represent language mathematically."
      highlights:
        - label: "Friday Deliverables & Poster Reminders"
          text: "Je'aime Powell and Dr. Linda Hayden reminded the cohort that draft posters, revised Course Goals slides, and initial GitHub repositories are due to be presented on Friday, August 14. Dr. Hayden noted she has reviewed the slide deck and left red-text feedback on everyone's slides, requiring a specific, actionable Science Gateway Goal, and posted sample goals from past years in Slack for guidance. Je'aime emphasized that all participants must email him their public GitHub repository links as soon as possible. Regarding the final posters for the in-person conference, Dr. Hayden clarified that she only needs the official poster titles by Friday to submit them as a group — the printed posters themselves (maximum size of 30\" × 45\") are the participants' responsibility to print and hang prior to the Gateways 2026 reception."
        - label: "Hands-On GitHub Walkthrough & Pro-Tip"
          text: "To support participants setting up their public repositories, Je'aime Powell led a live, step-by-step tutorial on creating a repository the \"easy way\": creating a new public repository with a README file, copying and pasting the official README.md template, using an AI model (like Claude or ChatGPT) to quickly populate the template with personalized biographical and syllabus details, and dragging and dropping required PDFs directly into the repo to commit them. Je'aime shared a pro-tip for quick edits: changing the .com in any active GitHub repository URL to .dev (e.g., github.dev) instantly spins up a web-based VS Code editing environment."
        - label: "Classroom Quantum Computing Resources"
          text: "Kristine Christensen presented a comprehensive suite of free, vetted educational resources to help faculty introduce quantum concepts without requiring advanced math and physics prerequisites. She highlighted the growing national urgency for quantum readiness, specifically noting NIST's upcoming 2030 post-quantum cryptography standards and the security threat of \"harvest now, decrypt later.\" Key resources shared included Quantum for All, National Q-12 Education Partnership, QuantumCT, and EdQuantum. She also noted that IBM Quantum provides free classroom accounts granting students 10 minutes of real QPU compute time per month, while Google Quantum AI offers rich instructional units."
        - label: "One-on-One Mentor Breakouts"
          text: "Per the cohort's preference, participants split into dedicated one-on-one virtual breakout rooms with their assigned technical mentors for 30 minutes to advance their curriculum and poster designs. Alumnus Hector Santiago (Senior Software Engineer at Nationwide and returning adjunct professor at Winston-Salem State University) joined the mentoring team to support Dr. Cheryl Swanier with her AI course adjustments. Given the limited time, multiple mentor-mentee pairings — such as Dr. Ahmad Al-Omari and Antigone Anthony — scheduled follow-up work sessions for Thursday to finalize their poster drafts."
        - label: "AI Deconstruction: Language, Tokens, and Spatial Context"
          text: "Charlie Dey continued the AI deconstruction lecture series by breaking down how LLMs represent and process language mathematically. He explained that computers process text by shredding words into mathematical fragments called tokens rather than syllables or grammatical units — using the word \"Avengers,\" he showed how the AI tokenizer breaks it into highly reusable dictionary parts (AV, ENG, and ERS). Words are translated into multi-dimensional numbers (word vectors) plotted in a vector space; he used a party analogy to illustrate \"contextual pull,\" where stranger words start out randomly scattered but, as they're used together, \"scoot their chairs closer,\" forming tight semantic clusters. Charlie reminded the cohort that LLMs are ultimately massive data compression and next-token prediction engines — they hallucinate because they are mathematically optimized to generate likely continuations and maintain conversational engagement rather than retrieve static facts."
