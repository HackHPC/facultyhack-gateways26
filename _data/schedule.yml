# FacultyHack@Gateways 2026 program schedule, shown on schedule.html.
# Three parts: the virtual training sessions (Aug 3-14), the in-person
# Gateways 2026 conference in D.C. (Sept 23-25), and a reusable
# breakdown of how each virtual session's 6-8 PM ET block is structured.
#
# Each entry under virtual_sessions may optionally add a `resources:`
# list once materials exist for that session (slides, a recording, a
# PDF handout, a linked article, etc.) — omit the key entirely for
# sessions with nothing yet, don't add an empty list. Only sessions that
# actually have resources render a "Resources" block on their card, and
# only then do they appear in the "Session Materials" section at the top
# of the Resources page. Each resource:
#   - name (required): link/file text.
#   - url (required): external link, or a path under assets/ for an
#     uploaded PDF.
#   - icon (optional, defaults to "solid:link"): same "style:name" schema
#     as _data/resources.yml — "custom:favicons/<domain-slug>" for a
#     fetched favicon (see "Icon system" in PICKUP_AND_GO.md for how to
#     add one), "solid:file-pdf" for an uploaded PDF, or any Font Awesome
#     "brands:<name>" / "solid:<name>" icon.
#   - description (optional): shown under the link if present.
#
# Each entry may also optionally add a `recap:` block once the session
# has actually happened — a write-up of what was covered, shown as a
# "Session Recap" block on the card. Omit entirely for sessions that
# haven't happened yet, same "don't add an empty one" rule as
# `resources:`. Fields: `title` (required), `intro` (optional lead
# paragraph), `highlights` (optional list of `label`/`text` pairs,
# rendered as a bolded-label list under a "Session Highlights"
# sub-heading).

virtual_sessions:
  - date: "Mon, August 3"
    announcements: "Kickoff, honorarium expectations, and mentor intros."
    training: "SGX3 Overview: Introduction to the Science Gateways Center of Excellence (SGX3) and computing environments."
    recap:
      title: "Session 1 Recap: Kickoff, Program Expectations, and SGX3 Overview (August 3, 2026)"
      intro: "The 5th Annual FacultyHack@Gateways 2026 officially launched with a virtual kickoff session that brought together organizers, technical mentors, and faculty participants from across the country."
      highlights:
        - label: "Welcome & Introductions"
          text: "Organizers Je'aime Powell, Dr. Linda Hayden, and Charlie Dey welcomed the cohort. Participants and mentors introduced themselves, sharing their diverse academic backgrounds, research interests, and preliminary plans for course modifications."
        - label: "SGX3 Center of Excellence Overview"
          text: "Dr. Hayden presented on the mission of SGX3, detailing how science gateways serve as vital full-stack bridges connecting researchers, educators, and students with advanced cyberinfrastructure and high-performance computing (HPC) resources."
        - label: "Deliverables & Honorarium Guidelines"
          text: "Je'aime Powell outlined the seven key deliverables required for participants to earn their $500 honorarium. These include Gateways 2026 conference registration, a travel support application, a bio/headshot, a Gateways poster, a GitHub project repository, a short blog post, and a NAIRR education account."
        - label: "Mentor-Mentee Pairings & Breakouts"
          text: "After reviewing expectations, participants broke out into dedicated virtual rooms with their assigned technical mentors. Teams established their preferred communication channels and began collaborating on their Course Goals slides ahead of Wednesday's training."
    resources:
      - name: "Slide Deck"
        url: "https://docs.google.com/presentation/d/1YQB_ANXMQlBK7-bgOTiSi9qTDFA9gPr-Cib6OozhucQ/edit?usp=sharing"
        icon: "custom:favicons/docs-google-com-presentation"
        description: "Slides for the Day 1 SGX3 Overview training."
      - name: "Science Gateways Community Institute (SGCI)"
        url: "https://sciencegateways.org"
        icon: "custom:favicons/sciencegateways-org"
        description: "National organization that provides training, consulting, software, and community support for developing and sustaining Science Gateways."
      - name: "Travel Support Application"
        url: "https://docs.google.com/forms/d/e/1FAIpQLSf6ka-yH_bZmHyUoLwR_jsMlKZCsjh2jkmxwOkrIp9Nm8tkuw/viewform"
        icon: "custom:favicons/docs-google-com"
        description: "Apply for travel support to attend Gateways 2026 in person — indicate that you are presenting a poster."
      - name: "Deliverables"
        url: "https://hackhpc.github.io/facultyhack-gateways26/deliverables/"
        icon: "solid:list-check"
        description: "The seven deliverables for this program and what's due when."
      - name: "README Template"
        url: "https://hackhpc.github.io/facultyhack-gateways26/assets/templates/facultyhack-readme-template.md"
        icon: "solid:file-lines"
        description: "Template for your final GitHub repository's README.md."
  - date: "Wed, August 5"
    announcements: "Day 1 recap, deliverables overview, and initial curriculum scoping."
    training: "NAIRR (Dr. Oyebade Oyerinde) & AI Deconstruction Intro: Deep dive into the National Artificial Intelligence Research Resource (NAIRR) Pilot Portal and introducing AI deconstruction methods."
    recap:
      title: "Session 2 Recap: NAIRR Allocations, Cloud Resources, and Google Notebook (August 5, 2026)"
      intro: "The second virtual session of FacultyHack@Gateways 2026 provided participants with critical pathways to acquire high-performance computing (HPC) and artificial intelligence (AI) allocations for their classrooms."
      highlights:
        - label: "The Google Notebook Showcase"
          text: "Organizer Je'aime Powell kicked off the session by demonstrating a powerful workflow utilizing Google's newly updated notebook tool (formerly known as NotebookLM). He showed how dropping session transcripts, meeting chats, and program slides into a dedicated notebook builds a highly targeted, scoped Retrieval-Augmented Generation (RAG) assistant. This allows participants to instantly query program details, deliverables, and lecture materials."
        - label: "NAIRR Pilot Portal & Classroom Allocations"
          text: "Dr. Oyebade Oyerinde (Clark Atlanta University, 2026 NSF NAIRR AI Education Fellow) led an in-depth training on the National Artificial Intelligence Research Resource (NAIRR) Pilot. He highlighted key educational resource providers including Jetstream2 (which offers JupyterHub interfaces and virtual GPU instances like NVIDIA A100s) and CloudBank (offering customized, lightweight JupyterHub environments featuring Python, R, and C++). Dr. Oyerinde shared his personal success deploying a customized CloudBank hub for CAU undergraduate students over the summer."
        - label: "The ACCESS and NAIRR Connection"
          text: "Guest expert Agbeli Ameko provided an essential structural overview. He explained that ACCESS-CI is a national consortium of supercomputing centers pooling hardware resources, while NAIRR is a specialized, NSF-supported subset explicitly dedicated to democratizing national AI training, tools, and research."
        - label: "Proposal Requirements & Scoping"
          text: "Instructors learned how to write a successful NAIRR Classroom Allocation proposal. Requirements include a registered ACCESS ID, an NSF-style CV, and a 3-page Main Document detailing course logistics, per-student GPU/CPU compute estimates, storage requests, and team preparedness. Dr. Oyerinde noted that failing to properly scope per-student resources is the most common stumbling block during the 1-month review process."
        - label: "ACCESS Account Troubleshooting"
          text: "Some participants, such as Kristine Christensen, ran into registration hurdles due to unrecognized institutional domains when creating ACCESS accounts. To resolve these roadblocks, Dr. Linda Hayden scheduled a dedicated ACCESS and NAIRR troubleshooting work session on Friday, August 7 at 5:00 PM Eastern."
        - label: "Mentor Collaboration & Course Goals"
          text: "The session concluded with participants transitioning into virtual breakout rooms with their technical mentors. Teams spent the final block refining their Course Goals slides and preparing for active curriculum adaptation."
    resources:
      - name: "Course Goals Slide Deck"
        url: "https://docs.google.com/presentation/d/1DMsv7JH1u9RGOlyo0nXebsESEMC6gXSJUrGXaL8UsSg/edit?usp=drive_link"
        icon: "custom:favicons/docs-google-com-presentation"
        description: "Course goals slides for this session."
      - name: "NAIRR Pilot Portal"
        url: "https://nairrpilot.org"
        icon: "custom:favicons/nairrpilot-org"
        description: "The National Artificial Intelligence Research Resource pilot portal managed by SGX3 for the NSF to share computing and AI resources across the research community."
  - date: "Fri, August 7"
    announcements: "Weekend prep, addressing technical hurdles, and progress review."
    training: "Course Goals & AI Deconstruction: Defining specific curriculum modules, actionable goals, and continuing AI deconstruction frameworks."
  - date: "Mon, August 10"
    announcements: "Week 2 kickoff and highlighting successful module ideas."
    training: "Gateways Central & AI Deconstruction: Led by returning faculty hackers. Practical insights, tool applications, and applying AI deconstruction to curriculum building."
    resources:
      - name: "Science Gateways Resource Catalog"
        url: "https://sciencegateways.org/resources/browse"
        icon: "custom:favicons/sciencegateways-org"
        description: "The Science Gateway Catalog is a collection of gateways and gateway-building technologies that offer a searchable way for developers and users to find existing resources."
  - date: "Wed, August 12"
    announcements: "Reminders for final deliverables and D.C. travel logistics."
    training: "AI Deconstruction Deep Dive: Advanced AI deconstruction workflows and a dedicated working sprint to integrate these concepts into course materials."
    resources:
      - name: "Deliverables"
        url: "https://hackhpc.github.io/facultyhack-gateways26/deliverables/"
        icon: "solid:list-check"
        description: "The seven deliverables for this program and what's due when."
      - name: "README Template"
        url: "https://hackhpc.github.io/facultyhack-gateways26/assets/templates/facultyhack-readme-template.md"
        icon: "solid:file-lines"
        description: "Template for your final GitHub repository's README.md."
  - date: "Fri, August 14"
    announcements: "Final wrap-up and next steps for Gateways 2026 in D.C."
    training: "Status Updates: First draft of posters, reviewing the GitHub repository structure, and finalizing deliverables."
    resources:
      - name: "Deliverables"
        url: "https://hackhpc.github.io/facultyhack-gateways26/deliverables/"
        icon: "solid:list-check"
        description: "The seven deliverables for this program and what's due when."
      - name: "README Template"
        url: "https://hackhpc.github.io/facultyhack-gateways26/assets/templates/facultyhack-readme-template.md"
        icon: "solid:file-lines"
        description: "Template for your final GitHub repository's README.md."

conference:
  - date: "Sept 23–25"
    event: "Gateways 2026 Conference Attendance"
    deliverables: "Faculty participate in conference sessions, workshops, and networking to fulfill honorarium requirements."
  - date: "TBA (During Reception)"
    event: "FacultyHack Poster Session & Awards"
    deliverables: >-
      Faculty hang printed posters (max 30"x45") prior to the event. One
      author must be present during the reception to answer questions and
      present their curriculum updates. Awards voted on by attendees.

daily_flow:
  - time: "6:00–6:30 PM (30 min)"
    activity: "Announcements"
    focus: "Administrative updates, daily objectives, spotlighting previous wins, and general Q&A."
  - time: "6:30–7:00 PM (30 min)"
    activity: "Mentor Time"
    focus: "Faculty and technical mentors break into teams to review progress, troubleshoot roadblocks, and map out how the upcoming training applies to their specific curriculum."
  - time: "7:00–8:00 PM (1 hr)"
    activity: "Training"
    focus: "Intensive instruction on HPC/AI tools, curriculum integration, and deliverables preparation."
