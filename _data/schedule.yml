  - date: "Mon, August 10"
    pre_session:
      time: "5:00–6:00 PM ET"
      focus: "AI Hands-on Session."
    announcements: "Science Gateways Catalog Overview — Dr. Tanganika Johnson, Dr. Cheryl Swanier, & Dr. Mary Beals"
    mentor_time: "Breakout rooms (3 groups)"
    training: "AI Deconstruction Deep Dive — Charlie Dey"
    recap:
      title: "Session 4 Recap: Gateways Catalog, Disciplinary Breakouts, and AI Readiness (August 10, 2026)"
      intro: "The fourth session of FacultyHack@Gateways 2026 kicked off Week 2 by focusing on gateway navigation, collaborative subgroup sprints, and hands-on data modeling."
      highlights:
        - label: "Science Gateways Catalog Overview"
          text: "Returning faculty members Dr. Mary Beals, Dr. Cheryl Swanier, and Dr. Tanganika (TK) Johnson led the opening half-hour to share practical tips for using the Science Gateways Catalog (Gateway Central). Dr. Beals demonstrated how typing specific keywords like \"ecology\" helped her narrow down a massive catalog into accessible tools, such as HPC Carpentry, Jetstream, and Jupyter Notebooks. Je'aime Powell explained that because the catalog pulls data from an external Globus database via an API, searching can be overwhelming, and direct catalog links can sometimes trigger a \"403 Forbidden\" error — to avoid this, participants should always navigate to the catalog by first clicking through the Gateway Central welcome page. Je'aime also highlighted that the catalog relies on manual updates rather than automated web-scraping, so some links might point to legacy versions (such as the original Jetstream instead of Jetstream 2)."
        - label: "Disciplinary Subgroup Collaboration"
          text: "Mentees and technical mentors split into three distinct virtual breakout rooms for 25 minutes to review curriculum integrations and align their semester structures. In the Biology/CS room, mentors Mohammed Elmellouki and Subil Abraham worked with Dr. Beals, Dr. TK, and Antigone Francis-Anthony to refine their course syllabi, focusing on narrowing their integrations down to 3 or 4 highly specific gateway topics rather than overwhelming students with too many tools. The CS/CS room addressed general setup bottlenecks, discussed the poster drafting process, and reviewed machine learning datasets. In the CS/ENG room, Dr. Mohamed Elbakary and Agbeli Ameko mapped out the structural sections of their conference posters and focused on refining their course syllabus to center around a single, cohesive dataset that students can actively build on throughout the entire semester."
        - label: "AI Deconstruction & Data Readiness Training"
          text: "Charlie Dey led the technical hour by illustrating how to teach data literacy, visualization, and basic machine learning using Google Colab and an open dataset of Austin Traffic Incident Reports. He showed how to inspect raw data profiles to spot dirty data, pointing out errors like longitude reading as a float while latitude was incorrectly formatted as a string. Students learned abstract relationships by plotting raw longitude and latitude points, which visually traces a recognizable map of Austin's city streets, then saw how K-means clustering naturally divides traffic data into geographic sectors (North Austin, downtown, West Austin), revealing hidden patterns like persistent construction zones. The training concluded with an overview of building knowledge graphs using triples (subject, predicate, object) — Charlie demonstrated using ChatGPT to parse raw Wikipedia text into structured JSON datasets, and explained that LLMs understand context because words are converted into multi-dimensional vectors (word embeddings) that naturally group together by semantic meaning."
        - label: "Critical Reminders & Next Steps"
          text: "Mentees must immediately review their slides in the shared Google Slides deck and address any red-text feedback left by Dr. Linda Hayden regarding their Science Gateway Goals — sample goals have been posted in the Slack channel for reference. First drafts of the Gateways 2026 posters are due this Friday, August 14, and must be uploaded directly to your public GitHub project repositories. For Wednesday's session (August 12), the cohort voted to use one-on-one mentor breakout sessions so everyone can receive direct, dedicated feedback on their poster layouts before Friday's presentations."
