    recap:
      title: "Session 3 Recap: ACCESS/NAIRR Troubleshooting, Disciplinary Subgroups, and AI Paradigms (August 7, 2026)"
      intro: "The third virtual session of FacultyHack@Gateways 2026 combined a hands-on troubleshooting pre-session with a restructured mentoring format and an introductory deep dive into how modern AI systems actually work."
      highlights:
        - label: "5:00 PM ET ACCESS & NAIRR Troubleshooting Session"
          text: "Prior to the official kickoff, organizers and mentors hosted an optional, highly productive MFA and account setup work session. Kristine Christensen celebrated successfully acquiring her ACCESS account after confirming her institution was recognized, noting that her registration confirmation had likely slipped into her spam filter. Dr. Joseph Aneke was guided through logging into the ACCESS CI portal, downloading and configuring the Duo Mobile MFA application, and setting up a secure Windows Hello passkey. Dr. Joshua Gbadebo was walked through using Mac Touch ID for his MFA passkey, successfully accessing his account, and navigating to the ACCESS allocations portal to prepare an \"Explore\" or \"Discover\" project request. Returning participant Dr. Cheryl Swanier briefly popped in from an external conference to confirm she had updated her Course Goals slide in the shared deck."
        - label: "Disciplinary Subgroup Collaboration"
          text: "To start the official two-hour block, Dr. Linda Hayden restructured the mentoring format, transitioning from individual breakout rooms to three disciplinary subgroups — Biology/CS, CS/CS, and CS/ENG — designed to foster cross-disciplinary peer feedback and let mentees draw on the expertise of multiple technical mentors. Participants expressed overwhelming support for the format: Dr. Mary Beals, Dr. Tanganika Johnson, and Antigone Francis-Anthony noted that the subgroups felt highly engaging and allowed them to collect diverse resource suggestions from mentors beyond their primary matches. Because Dr. Olabisi Ojo was absent, Dr. Hayden shifted Joshua Gbadebo into the CS/CS mentoring room for the evening to ensure he received immediate technical support."
        - label: "AI Paradigms & The Data Revolution"
          text: "Charlie Dey led the training hour with an introductory deep dive into how modern AI systems actually work. He mapped out AI's evolution from the 1950s Turing Test through 1980s neural networks, the 2012 deep learning revolution (spurred by AlexNet), to the 2017 pivot to Transformer architectures and self-attention. He explained that AI's sudden explosion isn't new mathematics but three modern factors — Scale (massive data sizes), Ubiquity (data collected everywhere), and Means (cheap, high-performance GPU hardware) — then illustrated Supervised Learning (labeled \"flashcards\"), Unsupervised Learning (finding hidden patterns/clusters), and Reinforcement Learning (reward-based trial and error), before breaking the AI Stack into three layers: Infrastructure (raw compute/hardware), the Model (a generalist \"brain\" like Llama or Gemini), and the Application (the specialist interface or agent)."
        - label: "Responsible AI in the Classroom Discussion"
          text: "The training sparked a lively discussion on incorporating AI responsibly in the classroom. Dr. Mohamed Elbakary suggested assigning students to solve a problem on their own, generate an AI solution, and write a comparative analysis between the two. Sajida Faiyaz shared her method of having students design logical Entity-Relationship Diagrams (ERDs) and hold \"logical diagramming sprints\" to critique where the AI's logic succeeds or fails. Je'aime Powell and Charlie Dey discussed \"K-Drama Challenges\" — assigning highly complex, oversized projects on incredibly short timelines, which naturally forces students to adopt AI as a collaborative conceptual partner rather than just a tool to copy answers from."
        - label: "Reminders & Next Steps"
          text: "Dr. Hayden and Je'aime Powell closed the session with key dates. Monday, August 10: Charlie Dey hosts a 5:00 PM ET hands-on AI training session (participants should have an active LLM open and Google Colab ready), followed by the 6:00 PM kickoff with returning faculty Dr. Tanganika Johnson, Dr. Cheryl Swanier, and Dr. Mary Beals leading an overview of the Science Gateways Resource Catalog (Gateway Central), then subgroup disciplinary mentoring continuing from 6:30–7:30 PM ET. All participants must review their slides in the shared Course Goals deck — Dr. Hayden left red-text feedback on slides needing updates and posted sample Science Gateway Goals in Slack for reference. First drafts of Gateways 2026 posters are due in one week, on Friday, August 14."
