- name: "Dr. Linda Hayden"
  affiliation: "Science Gateways Community Institute"
  affiliation_url: "https://sciencegateways.org/"
  affiliation_icon: "custom:favicons/sciencegateways-org"
  photo: "/assets/images/organizers/linda-hayden.jpeg"
  bio: >-
    Dr. Linda Hayden holds a Ph.D. in Mathematics and Education. She leads
    workforce development activities for the NSF Science Gateways
    Community Institute (SGCI). In that position she works to train the
    next generation of gateway developers and users. Professor Hayden is
    an NSF Presidential Awardee for Excellence in Science, Mathematics and
    Engineering Mentoring.
