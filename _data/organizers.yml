# Organizers for FacultyHack@Gateways 2026, carried over from last year's
# roster at
# https://github.com/HackHPC/facultyhack-gateways25/blob/main/_data/organizers.yml
#
# Bios reused verbatim from that source file. Personal/work email addresses
# from the source were intentionally dropped, consistent with mentors.yml's
# privacy rules — do not add them back. ResearchGate links were also
# dropped: the source only stored short profile codes (e.g. "L-Hayden"),
# and ResearchGate profile URLs require an exact numeric suffix that can't
# be reliably reconstructed from that alone, so a link was not guessed.
