- name: "Je'aime Powell"
  affiliation: "Omnibond"
  affiliation_url: "http://www.omnibond.com"
  affiliation_icon: "custom:favicons/omnibond-com"
  photo: "/assets/images/organizers/jeaime-powell.png"
  bio: >-
    Je'aime Powell currently works as a Senior Systems Administrator and
    Technical Research Design Analyst at the Texas Advanced Computing
    Center (TACC) within the University of Texas at Austin. While
    supporting high-performance computing users, he also leads hackathons,
    STEM-based high school summer camps, and facilitates related training
    sessions. His research in the fields of Intelligent Systems and
    Decision Systems Support with a focus on the development of adaptive
    IoT environmental sensors. He holds both a Master's degree in Applied
    Mathematics with a Concentration in Remote Sensing and a Bachelor's in
    Computer Science from Elizabeth City State University.
