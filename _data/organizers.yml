- name: "Boyd Wilson"
  affiliation: "Omnibond"
  affiliation_url: "http://www.omnibond.com/"
  affiliation_icon: "custom:favicons/omnibond-com"
  photo: "/assets/images/organizers/boyd-wilson.png"
  bio: >-
    Boyd Wilson, CEO of Omnibond Systems, has extensive experience and
    leadership in the areas of software development, system
    administration, storage architectures and business models. Formerly,
    Boyd served as Software CTO and also Executive Director over computing
    operations at Clemson University and had research computing as part
    of his purview. He has participated in various academic grants,
    papers and workshops in the areas of parallel storage, cloud
    computing and computational infrastructure. Boyd's current focus lies
    in four areas: computer vision, AI, and real-time traffic analytics
    with TrafficVision; high-performance computing and storage with
    CloudyCluster and OrangeFS; identity and security management; and
    wake surfing and riding a boosted board around cities while
    traveling.
  links:
