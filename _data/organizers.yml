- name: "Charlie Dey"
  affiliation: "Texas Advanced Computing Center"
  affiliation_url: "https://www.tacc.utexas.edu/about/directory/charlie-dey"
  affiliation_icon: "custom:favicons/tacc-utexas-edu"
  photo: "/assets/images/organizers/charlie-dey.jpeg"
  bio: >-
    Charlie Dey (he/him) is the Director of Training and Professional
    Development with the User Services group at the Texas Advanced
    Computing Center (TACC) with a background in web development and
    scientific computing. Charlie's responsibilities at TACC include
    organizing, developing content, and building curriculums for TACC's
    academic course selection taught in conjunction with several
    departments at the University of Texas at Austin, as well as for
    TACC's professional development and educational training. Prior to
    joining TACC, he worked as a Senior Application Developer for the
    Carle Foundation Hospital, and as a computer science instructor at
    Parkland College in Champaign, IL. He was also a member of a
    specialized application development team at the University of
    Illinois and has been a contracted research consultant for NASA Ames
    Research Center, studying computational immunology and bioinformatics.
    Charlie holds a Bachelor's Degree concentrating in Computer Science and
    Biology from Eastern Illinois University, and certifications in 3D
    programming and visualization. He is currently finishing up a Master's
    of Science in Cybersecurity.
  links:
