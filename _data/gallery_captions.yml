# Captions/alt text for assets/files/sgx3_facultyhack_pictures/, keyed by
# filename. Looked up in gallery.html; any image dropped into that folder
# without a matching entry here still appears in the gallery automatically,
# just with a generic fallback caption (see gallery.html) instead of one of
