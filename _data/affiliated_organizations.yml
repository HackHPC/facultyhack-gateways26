# Institutions affiliated with FacultyHack@Gateways 2026 participants
# (mentee/mentor/organizer institutions), shown as markers on the
# community map on index.html. Coordinates were geocoded via the
# Nominatim/OpenStreetMap API (https://nominatim.openstreetmap.org),
# not estimated by hand — each query and its resolved OSM display_name
# were logged during the one-time geocoding pass (not checked into the
# repo) for verification. Most resolve to the actual campus/site; a
# few (Mississippi Valley State University, Southern University A&M
# College, Omnibond, Science Gateways Community Institute) fell back to
# city-center coordinates when the specific institution wasn't a
# separately-mapped point in OpenStreetMap.
#
# "Southern University A&M College" / "Omnibond" / "Science Gateways
# Community Institute" here represent merged duplicate entries from
# across _data/mentors.yml, _data/organizers.yml, _data/teams.yml, and
# _data/sponsors.yml (see PICKUP_AND_GO.md "Community map" for which
# alternate names/spellings were merged into which).
#
# icon: every entry here already had a real fetched favicon vendored
# under _includes/icons/favicons/ from earlier work this session (each
# mentor/mentee/organizer/sponsor already links to these same domains) —
# reused as-is via the same "custom:favicons/<domain-slug>" schema used
# everywhere else in this project, no new fetches needed. Rendered into
# the map popups at build time (index.html captures each org's
# icon.html output into the embedded JSON), since the popups are built
# by client-side JS and can't call the Liquid icon.html include directly.

