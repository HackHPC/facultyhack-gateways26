# Curated external resources for FacultyHack@Gateways 2026 participants.
# Grouped by category; each resource has name, description, and url.
# url is optional — omit rather than guess if one isn't known (see the
# inline comments on individual entries below for why).
#
# Categories were consolidated from an earlier, more granular set (26
# categories, several with just 1-2 entries) into this smaller set of 11,
# by grouping thematically related categories together. No resources were
# removed or altered in the process — every entry from the original
# sources (this program's own curation, plus merges from
# HackHPC/admi26 and HackHPC/hpcresources-pearc26) is still present,
# just filed under a broader heading.
#
# Each category has a default `icon` (a generic topic icon under
# _includes/icons/category-*.svg). Individual resources may set their own
# `icon` to override it with a specific brand icon (github, google,
# microsoft, amazon, python, jupyter, figma, r-project, wikipedia) when the
# resource is from one of those well-known, easily recognizable brands —
# not attempted for every resource, since most don't have a distinct,
# widely-recognized mark and forcing one would be more noise than signal.

- category: "Science Gateways"
  icon: "category-gateway"
  resources:
    - name: "Science Gateways Community Institute (SGCI)"
      description: "National organization that provides training, consulting, software, and community support for developing and sustaining Science Gateways."
      url: "https://sciencegateways.org"
    - name: "Science Gateways Catalog"
      description: "Searchable directory of Science Gateways across many scientific disciplines. Useful for discovering existing gateways and classroom examples."
      url: "https://catalog.sciencegateways.org"
    - name: "projectEUREKA!"
      description: "Browser-based Science Gateway platform that enables instructors and researchers to provide HPC applications without requiring Linux expertise."
      url: "https://projecteureka.org"
    - name: "DesignSafe-CI"
