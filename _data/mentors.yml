- name: "Mohammed Elmellouki"
  affiliation: "Mississippi Valley State University"
  affiliation_url: "https://www.mvsu.edu/"
  affiliation_icon: "custom:favicons/mvsu-edu"
  specialty: ["Computational Fluid Dynamics", "Heat Transfer"]
  history:
    - year: 2024
      role: "Faculty Participant"
    - year: 2025
      role: "Mentor"
  bio: >-
    Dr. Mohammed Elmellouki is an Assistant Professor at Mississippi Valley
    State University, where his research centers on computational fluid
    dynamics, turbulence modeling, and heat transfer, including simulation
    work using the Nek5000 spectral element solver. He holds a Ph.D. in
    Mechanical Engineering and has published on turbulent flow and thermal
    structures in low-Prandtl number buoyant flows using direct numerical
    simulation. He currently serves as Principal Investigator on a
    Mississippi Research Alliance-funded project focused on enhancing
    research capacity and workforce development through multidisciplinary
    simulation and experimental testing of novel ventricular shunt
    designs. Dr. Elmellouki also served as lead faculty advisor for MVSU's
    team at the 2024 Presidential Forum for Historically Black Colleges and
    Universities in Atlanta, Georgia.
  links:
