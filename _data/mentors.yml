    - year: 2023
      role: "Mentor"
    - year: 2024
      role: "Mentor"
    - year: 2025
      role: "Mentor"
    - year: 2025
      role: "Mentor"
  bio: >-
    Dr. John Holmen is an HPC Engineer in the System Acceptance and User
    Environment Group of the National Center for Computational Sciences at
    Oak Ridge National Laboratory. He holds a B.S. and M.S.E. in Computer
    Engineering from Kettering University and a Ph.D. in Scientific
    Computing from the University of Utah, where his dissertation research
    under Dr. Martin Berzins focused on portable, scalable approaches for
    preparing large legacy codes and asynchronous many-task runtime systems
    for exascale computing. As a developer for the Uintah Computational
    Framework, he tested performance across major systems including NSF
    Frontera, DOE Lassen, DOE Summit, NSF Stampede2, DOE Theta, and DOE
    Titan. Before graduate school, he worked as a Development Engineer at
    R.W. Beckett Corporation designing embedded systems for safety-critical
    combustion products, having started there as a Kettering co-op student.
