  bio: >-
    Subil Abraham is an HPC Engineer in the Operations – User Assistance
    group of the National Center for Computational Sciences at
    Oak Ridge National Laboratory. He holds an M.S. in Computer Science
    from Virginia Tech, where his graduate thesis examined container
    performance on HPC workloads and filesystems. Before his current role,
    he interned in ORNL's Technology Integration group evaluating
    SymphonyFS performance. His interests include containers for
    high-performance computing, parallel programming, and HPC
    infrastructure and performance evaluation.
