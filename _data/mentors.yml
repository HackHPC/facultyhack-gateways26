# Program mentors for FacultyHack@Gateways 2026.
# Only publicly-appropriate fields are stored here: name, affiliation, and
# public profile links the mentors themselves shared for this purpose. Do
# not add phone numbers, mailing addresses, or personal email addresses to
# this file.
#
# link.icon must match a file in _includes/icons/ (linkedin, facebook,
# scholar, link).
#
# photo (optional): path to a headshot under assets/images/mentors/, only
# ever added once the mentor's explicit permission (or a photo they
# submitted directly) exists for that specific file — see the README in
# that directory. Never populate this by downloading images from LinkedIn,
# Facebook, or institutional staff pages without that permission.
#
# history (optional): list of past program involvement, rendered under
# "FacultyHack History" as "<year> — <role>", every entry formatted the
# same way regardless of event. Each entry needs `year` and `role`. By
# default the year links to that year's FacultyHack@Gateways archive
# site (looked up from _data/archives.yml by year) — fine for
# straightforward FacultyHack@Gateways participation. For involvement in
# a differently-named/branded HackHPC event (e.g. "HPC in the City") —
# where that lookup would link to the wrong site — add an explicit `url`
# to override it, and fold which event it was into the `role` text
# itself (e.g. "Organizer — HPC in the City: Pandemics") rather than
# adding a separate displayed field.
- name: "Ahmad Al-Omari"
  affiliation: "Our Lady of the Lake University"
  affiliation_url: "https://www.ollusa.edu/"
  affiliation_icon: "custom:favicons/ollusa-edu"
  specialty: ["Cybersecurity", "Digital Forensics"]
  bio: >-
    Dr. Ahmad Al-Omari is an Assistant Professor of Computer Information
    Systems and Security at Our Lady of the Lake University. He holds a
    Doctor of Science in Information Assurance and Computer Security and a
    Master of Science in Information Systems, both from Dakota State
    University, along with an MBA and a B.A. in Banking and Finance from
    Yarmouk University. His work focuses on information security policy
    compliance, cybersecurity ethics, security awareness, insider threats,
    data privacy, security informatics, and digital forensics. In the
    classroom, he combines lectures, discussion sections, and hands-on
    projects to build an interactive learning environment, and he is an
    active member of the Association for Computing Machinery (ACM) and the
    Association for Information Systems (AIS).
  photo: "assets/images/mentors/ahmad-al-omari.jpg"
  history:
    - year: 2024
      role: "Faculty Participant"
  links:
    - label: "Staff Profile"
      url: "https://www.ollusa.edu/sbl/profiles/ahmad-al-omari.html"
      icon: "custom:favicons/ollusa-edu"
    - label: "Facebook"
      url: "https://www.facebook.com/ahmad.alomari.102"
      icon: "brands:facebook"

- name: "Anas AlSobeh"
  affiliation: "Utah Valley University"
  affiliation_url: "https://www.uvu.edu/"
  affiliation_icon: "custom:favicons/uvu-edu"
  specialty: ["AI-Driven Cybersecurity", "Cloud Computing"]
  bio: >-
    Dr. Anas AlSobeh is an Assistant Professor of Applied AI in the
    Department of Information Systems & Technology at Utah Valley
    University, which he joined in January 2026 after serving as Assistant
    Professor and Program Coordinator of Information Technology &
    Cybersecurity at Southern Illinois University Carbondale. He earned his
    Ph.D. in Computer Science from Utah State University and both his M.Sc.
    and B.Sc. in Computer Information Systems from Yarmouk University in
    Jordan. His research spans AI-driven cybersecurity, trustworthy and
    explainable AI, software engineering, cloud computing, and data
    science, with applications including malware detection and deepfake
    analysis. He currently leads a USDA-funded project developing AI- and
    microscopic-imaging-based Salmonella detection methods for food safety,
    has authored more than 50 peer-reviewed publications, received the
    IACIS 2024 Best Paper Award, and holds Senior Member status with IEEE.
  photo: "assets/images/mentors/anas_alsobeh.jpg"
  history:
    - year: 2025
      role: "Mentor"
  links:
