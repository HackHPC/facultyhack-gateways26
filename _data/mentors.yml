- name: "Elijah MacCarthy"
  affiliation: "Oak Ridge National Laboratory"
  affiliation_url: "https://www.ornl.gov/"
  affiliation_icon: "custom:favicons/ornl-gov"
  specialty: ["GPU Computing", "Parallel Computing"]
  photo: "assets/images/mentors/elijah_maccarthy.jpg"
  history:
    - year: 2022
      role: "Mentor"
    - year: 2023
      role: "Mentor"
    - year: 2025
      role: "Mentor"
  bio: >-
    Dr. Elijah MacCarthy is an HPC Engineer in the Systems Acceptance and
    User Environment group of the National Center for Computational
    Sciences at Oak Ridge National Laboratory. He holds a Ph.D. in
    Computational Science and Engineering from North Carolina A&T State
    University. Before joining ORNL, he was an Assistant Professor of
    Mathematics in the Division of Natural and Physical Sciences at Lane
    College, where he served as the XSEDE Campus Champion and led GPU
    programming and program optimization research within high-performance
    computing environments. His research interests include GPU programming,
    program parallelization and optimization, and infection spread
    modeling, work that bridges applied mathematics and large-scale
    computational science.
  links:
    - label: "Staff Profile"
      url: "https://www.ornl.gov/staff-profile/elijah-maccarthy"
      icon: "custom:favicons/ornl-gov"

- name: "Felicia Doswell"
  affiliation: "Norfolk State University"
  affiliation_url: "https://www.nsu.edu/"
  affiliation_icon: "custom:favicons/nsu-edu"
  specialty: ["Cybersecurity", "Artificial Intelligence"]
  photo: "assets/images/mentors/Felicia-Doswell.jpg"
  history:
    - year: 2022
      role: "Faculty Participant"
  bio: >-
    Dr. Felicia Doswell is an Associate Professor of Computer Science at
    Norfolk State University and former Interim Chair of the Department
    of Computer Science. She earned a Ph.D., M.S., and B.S. in Computer
    Science from Virginia Tech, Georgia Tech, and Norfolk State
    University, respectively. Dr. Doswell brings more than three decades
    of combined academic and industry experience to computing education
    and research. Prior to joining academia, she held technical
    positions with AT&T Bell Laboratories, Tekelec, and Nortel,
    contributing to software engineering and network systems. Her
    research interests include cybersecurity, artificial intelligence,
    high-performance computing, and computing education. She has
    secured funding from the National Science Foundation and industry
    partners, including Lockheed Martin, Apple, Google, and Micron
    Technology, to support workforce development efforts and student
    research. Dr. Doswell is committed to mentoring undergraduate and
    graduate students, advising numerous theses and capstone projects in
    cybersecurity, artificial intelligence, secure software development,
    and cloud computing. Her leadership has contributed to ABET
    accreditation efforts, curriculum innovation, development of
    accelerated degree programs, expansion of research infrastructure,
    and service to the broader computing education community through
    active involvement in professional organizations and conference
    board membership.
  links:
    - label: "Staff Profile"
      url: "https://www.nsu.edu/Academics/Faculty-and-Academic-Divisions/Schools-and-Colleges/College-of-Science-Engineering-and-Technology/Departments/Computer-Science/Faculty-and-Staff/Felicia-Doswell"
      icon: "custom:favicons/nsu-edu"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/felicia-doswell-3b77701b"
      icon: "brands:linkedin"

