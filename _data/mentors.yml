  bio: >-
    Dr. Sabrina Perry is an Assistant Professor of Computer Science and
    Information Technology at Austin Peay State University, which she
    joined in 2025. She earned her Ph.D. in Engineering Science with a
    concentration in Computer Science from the University of Mississippi,
    a B.S. from Mississippi Valley State University, and an M.S. from
    Illinois State University. Before joining Austin Peay, she spent
    nearly a decade in the classroom as an engineering technology
    instructor at Mississippi Valley State University beginning in 2016,
    building extensive experience teaching computing and engineering
    concepts to undergraduates. That combination of applied engineering
    technology instruction and doctoral-level computer science training
    informs her approach to computing education at Austin Peay.
