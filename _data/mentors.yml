- name: "Olabisi Ojo"
  affiliation: "Albany State University"
  affiliation_url: "https://www.asurams.edu/"
  affiliation_icon: "custom:favicons/asurams-edu"
  specialty: ["Microbial Genomics", "Computational Biology"]
  photo: "assets/images/mentors/olabisi_ojo.jpeg"
  history:
    - year: 2024
      role: "Faculty Participant"
    - year: 2025
      role: "Mentor"
  bio: >-
    Dr. Olabisi Ojo is a Professor in the Department of Natural Sciences at
    Albany State University, a position he has held since 2021. He earned
    his Ph.D. in Microbiology from University College Cork, an M.Sc. in
    Biochemistry from the University of Lagos, and a B.Sc. from the
    University of Benin. His research spans microbial genomics, molecular
    epidemiology, and the application of AI and machine learning to
    microbiology and healthcare, and he teaches Introduction to
    Microbiology, Introduction to Biological Sciences, and Senior Research.
    Dr. Ojo received a Carnegie African Diaspora Fellowship Program (CADFP)
    award to advance microbial genomics research and strengthen
    microbiology curricula, collaborating with the Department of
    Microbiology at Osun State University in Nigeria on curriculum
    co-development, workshops, and graduate student mentoring.
  links:
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/olabisiojo/"
