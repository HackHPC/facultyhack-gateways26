# FacultyHack@Gateways 2026 mentee/mentor pairings, shown on teams.html.
#
# Sourced from a pasted spreadsheet. Both mentee and mentor emails
# (personal and institutional) were dropped entirely, per this project's
# standing privacy rule — see the note at the top of _data/mentors.yml.
# "N/A" / "n/a" / "I don't have one" placeholder values in the source
# were treated as "no link", not rendered literally. A few cells had
# duplicate URLs across the "social media" and "professional URL"
# columns — deduplicated to one link rather than showing the same URL
# twice.
#
# Entries are kept sorted alphabetically by mentee first name (source
# order, not rendered via a Liquid sort) — same convention as
# _data/mentors.yml being kept sorted by last name in the file itself.
#
# `mentor_name` is looked up against `site.data.mentors` at render time
# (teams.html) to reuse that mentor's existing affiliation/link/photo
# rather than duplicating it here — all 11 mentors now have a profile on
# the Mentors page (Subil Abraham, mentoring Mary Beals below, was added
# there 2026-07-30 with only name + affiliation since no other data about
# them exists — see _data/mentors.yml and PICKUP_AND_GO.md "Teams page").
# `mentor_affiliation`/`mentor_affiliation_url`/`mentor_affiliation_icon`
# still exist as a plain-text fallback in `teams-card.html` for the (now
# hypothetical) case of a pairing whose mentor isn't in mentors.yml at all.
#
# mentee.affiliation_url / affiliation_icon: each institution's own real
# website + a fetched favicon (same fetch-and-vendor process documented in
# PICKUP_AND_GO.md for the Resources page icons), stored under
# _includes/icons/favicons/. "Southern University A&M College" and
# "Southern University and A&M College" are the same institution (subr.edu)
# spelled two ways in the source spreadsheet — left as originally entered,
# both link to the same URL/icon.
#
# mentee.target_course_number / anticipated_enrollment / project_goals /
# science_gateway_goal (all optional): sourced from each mentee's own
# course-goals PDF under assets/files/teams/<mentee-slug>/ — initially
# "Initial_Course_Goals.pdf", later superseded by "Updated_Course_Goals.pdf"
# once a mentee revised their slide (most did, partway through the
# program) — the updated PDF is treated as the current source of truth
# wherever the two differ, including for `target_course`/
# `target_course_number` themselves (see PICKUP_AND_GO.md "Teams page"
# for which fields changed between the initial and updated PDFs and why).
# `project_goals` is a plain list of strings, rendered as a bulleted
# list. `science_gateway_goal` is a single string — a later addition to
# the slide template, a synthesized one-paragraph goal statement
# distinct from the bulleted `project_goals` list, rendered under its
# own "Science Gateway Goal" label; only present once a mentee's
# updated PDF actually filled that section in (a few left it blank).
# Not every mentee has a PDF at all, and not every field is filled in on
# every PDF that exists — omit whichever of these fields aren't
# applicable rather than guessing.
#
# mentee.science_gateway_resources (optional): a list of specific tools/
# datasets/platforms a mentee is using, sourced from their own poster —
# not from the course-goals PDF template like the fields above. Same
# schema as a schedule.yml resource (`name`, `url`, `icon`, `description`
# — `url` and `icon` both optional), rendered under its own "Science
# Gateways Resources" label via the same shared `resource-item.html`
# partial schedule.yml resources use. `url` is omitted for tools with no
# link given on the source poster — `resource-item.html` already
# renders those as plain unlinked text.
#
# mentee.project_repo (optional): a single GitHub repo URL, rendered
# under its own "Project Repo" label — separate from the generic
# `links:` list below, which has no per-item label of its own. Only
# Oyebade Oyerinde has one so far; add the same field to any other
# mentee once their repo exists rather than putting it in `links:`.

