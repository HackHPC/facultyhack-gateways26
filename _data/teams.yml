# FacultyHack@Gateways 2026 mentee/mentor pairings, shown on teams.html.
#
# Sourced from a pasted spreadsheet. Both mentee and mentor emails
# (personal and institutional) were dropped entirely, per this project's
# standing privacy rule — see the note at the top of _data/mentors.yml.
# "N/A" / "n/a" / "I don't have one" placeholder values in the source
# were treated as "no link", not rendered literally. A few cells had
# duplicate URLs across the "social media" and "professional URL"
# columns — deduplicated to one link rather than showing the same URL
# twice.
#
# Entries are kept sorted alphabetically by mentee first name (source
# order, not rendered via a Liquid sort) — same convention as
# _data/mentors.yml being kept sorted by last name in the file itself.
#
# `mentor_name` is looked up against `site.data.mentors` at render time
# (teams.html) to reuse that mentor's existing affiliation/link/photo
# rather than duplicating it here — all 11 mentors now have a profile on
# the Mentors page (Subil Abraham, mentoring Mary Beals below, was added
# there 2026-07-30 with only name + affiliation since no other data about
# them exists — see _data/mentors.yml and PICKUP_AND_GO.md "Teams page").
# `mentor_affiliation`/`mentor_affiliation_url`/`mentor_affiliation_icon`
# still exist as a plain-text fallback in `teams-card.html` for the (now
# hypothetical) case of a pairing whose mentor isn't in mentors.yml at all.
#
# mentee.affiliation_url / affiliation_icon: each institution's own real
# website + a fetched favicon (same fetch-and-vendor process documented in
# PICKUP_AND_GO.md for the Resources page icons), stored under
# _includes/icons/favicons/. "Southern University A&M College" and
# "Southern University and A&M College" are the same institution (subr.edu)
# spelled two ways in the source spreadsheet — left as originally entered,
# both link to the same URL/icon.

