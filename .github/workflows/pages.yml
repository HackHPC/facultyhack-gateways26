name: Deploy Jekyll site to Pages

# Builds with this repo's own Gemfile (Jekyll ~> 4.4, see Gemfile's own
# comment) via GitHub Actions, instead of GitHub's legacy Pages builder —
# the legacy builder pins Jekyll 3.10 via the `github-pages` gem, which
# cannot satisfy this Gemfile's dependencies. See PICKUP_AND_GO.md
# "Toolchain: why plain Jekyll instead of the github-pages gem".
#
# Requires the repo's Settings > Pages > Build and deployment > Source
# to be set to "GitHub Actions" (not "Deploy from a branch") for this
# workflow to actually control what gets deployed.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
